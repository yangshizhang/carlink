name: Windows Receiver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: npm run dist:windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carlink-windows
          path: apps/windows/dist/*
