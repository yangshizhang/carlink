name: CarLink
options:
  bundleIdPrefix: com.yangshizhang
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  CarLink:
    type: application
    platform: iOS
    sources:
      - path: Sources/CarLink
    resources:
      - path: Sources/CarLink/Resources
